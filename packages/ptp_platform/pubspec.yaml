name: ptp_platform
description: Android (Kotlin) and iOS (Swift) adapters for Phone Transfer Pro. NOT YET BUILT.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0" # built-in Kotlin (audit P1-9)

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.phonetransferpro.ptp_platform
        pluginClass: PtpPlatformPlugin
      ios:
        pluginClass: PtpPlatformPlugin
