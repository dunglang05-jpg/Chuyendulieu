// NOT YET BUILT. Versions are intended values; align with the AGP/Kotlin of the generated app project.
group 'com.phonetransferpro.ptp_platform'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects { repositories { google(); mavenCentral() } }

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.phonetransferpro.ptp_platform'
    compileSdk 34
    defaultConfig { minSdk 29 }   // scoped storage + MediaStore.Downloads; see docs/STATUS.md
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
}
