// Audit P1-9: migrated to built-in Kotlin (AGP 9) following
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors :
// the Kotlin Gradle Plugin is no longer applied here and kotlinOptions became kotlin.compilerOptions.
// Requires Flutter >= 3.44 (pubspec). The host app generated by `flutter create` provides AGP + Kotlin.
group 'com.phonetransferpro.ptp_platform'
version '0.1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

rootProject.allprojects { repositories { google(); mavenCentral() } }

apply plugin: 'com.android.library'

android {
    namespace 'com.phonetransferpro.ptp_platform'
    compileSdk 36   // needed for Service.onTimeout(int,int) (API 35)
    defaultConfig { minSdk 29 }   // scoped storage + MediaStore.Downloads; see docs/STATUS.md
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { test.java.srcDirs += 'src/test/kotlin' }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
