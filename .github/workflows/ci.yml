# Builds and tests on GitHub's hosted runners (no local machine needed).
# Results are real CI logs; an APK artifact is uploaded for installing on an Android phone.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-peer:
    name: Protocol reference tests (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/reference_peer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography pytest pytest-asyncio pytest-timeout
      - run: python -m pytest -q --timeout 120

  android:
    name: Flutter analyze, test, build APK
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter --version
      - run: bash tool/bootstrap.sh
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: flutter test --reporter expanded
        if: success() || failure()
      - name: Build debug APK
        run: flutter build apk --debug
        if: success() || failure()
      - name: Android plugin unit tests (JVM) — USB bridge
        working-directory: app/android
        run: ./gradlew :ptp_platform:testDebugUnitTest --no-daemon --console=plain
        if: success() || failure()
      - name: Build release APK for arm64 phones (signed with the debug key until a release keystore exists)
        run: flutter build apk --release --target-platform android-arm64
        if: success() || failure()
      - name: Dependency, manifest and Kotlin/AGP report (audit P1-8, P1-9) — evidence only, never fails the build
        if: success() || failure()
        working-directory: app/android
        run: |
          R=../build/reports/supply-chain; mkdir -p $R
          ./gradlew --version > $R/gradle-version.txt 2>&1 || true
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon --console=plain > $R/release-runtime-deps.txt 2>&1 || true
          echo "== Google ML Kit / Play services / DataTransport / Firebase artifacts in the release APK classpath =="
          grep -oE "(com\.google\.(mlkit|android\.gms|android\.datatransport|firebase)|com\.google\.firebase)[:a-z0-9._-]*" $R/release-runtime-deps.txt | sort -u | tee $R/google-artifacts.txt || true
          echo "== Which direct dependency pulls them =="
          grep -nE "^[+\\]--- (project|com\.google)" $R/release-runtime-deps.txt | head -40 || true
          M=$(find ../build -path "*merged_manifests*release*" -name AndroidManifest.xml | head -1); echo "merged manifest: $M"
          [ -n "$M" ] && cp "$M" $R/merged-release-manifest.xml
          [ -n "$M" ] && grep -nE "<(service|provider|receiver|activity|uses-permission)|meta-data" "$M" | grep -viE "phonetransferpro\.ptp_platform\.TransferService" | tee $R/manifest-components.txt || true
          echo "== Host project Kotlin/AGP setup generated by flutter create =="
          for f in settings.gradle settings.gradle.kts build.gradle build.gradle.kts app/build.gradle app/build.gradle.kts gradle.properties gradle/wrapper/gradle-wrapper.properties; do
            [ -f "$f" ] && { echo "--- $f"; grep -nE "kotlin|com\.android|agp|builtInKotlin|distributionUrl|newDsl" "$f"; }
          done | tee $R/host-gradle.txt || true
          grep -A3 "mobile_scanner:" ../pubspec.lock | tee $R/mobile_scanner-lock.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-report
          path: app/build/reports/supply-chain
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('app/build/app/outputs/flutter-apk/app-release.apk') != ''
        with:
          name: chuyen-du-lieu-release-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('app/build/app/outputs/flutter-apk/app-debug.apk') != ''
        with:
          name: phone-transfer-pro-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: xcodebuild -version && flutter --version
      - run: bash tool/bootstrap.sh
      - name: Build iOS without code signing
        run: flutter build ios --debug --no-codesign
